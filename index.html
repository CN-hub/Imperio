<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Império Tintas e Revestimentos - Sistema Integrado</title>
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('imperio_tema')||'light')}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
:root,[data-theme=light]{--bg:#F3F4F8;--side:#FFFFFF;--card:#FFFFFF;--card2:#F6F7FB;--input:#FFFFFF;--border:#E3E6EE;--border2:#CBD1E0;--text:#121829;--muted:#4A5570;--dim:#7C86A0;--pri:#3B54E0;--pri2:#2D43BC;--soft:#E9EDFE;--gold:#A5650A;--green:#12805F;--red:#C5363F;--blue:#3B54E0;--hover:#F0F2F9;--shadow:0 1px 2px rgba(18,24,41,.05);--pop:0 18px 50px rgba(18,24,41,.18)}
[data-theme=dark] .b-p,[data-theme=dark] .b-s,[data-theme=dark] .b-d,[data-theme=dark] .grad,[data-theme=dark] .pager button.on,[data-theme=dark] .toast.err{color:#0B101B}
[data-theme=dark]{--bg:#0B101B;--side:#0E1420;--card:#131A2A;--card2:#182036;--input:#0F1626;--border:#222B41;--border2:#33405F;--text:#E7EBF5;--muted:#A2ADC6;--dim:#6C7893;--pri:#7189FF;--pri2:#93A5FF;--soft:rgba(113,137,255,.14);--gold:#E8AE45;--green:#38C99D;--red:#F2757D;--blue:#7F95FF;--hover:rgba(255,255,255,.04);--shadow:0 1px 2px rgba(0,0,0,.35);--pop:0 18px 50px rgba(0,0,0,.6)}
body{font-family:'Manrope','Segoe UI',system-ui,sans-serif;line-height:1.5;background:var(--bg);color:var(--text);min-height:100vh;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.grad{background:var(--pri);color:#fff}
.hidden{display:none!important}
/* ---- Faixa de pigmentos: gerada a partir das cores cadastradas ---- */
.swatches{display:flex;height:6px;border-radius:6px;overflow:hidden;margin-bottom:18px;background:var(--border)}
.swatches i{flex:1;min-width:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.22)}
/* ---- Login ---- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9000;background:var(--bg);overflow:auto}
.lcard{width:100%;max-width:390px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:0 28px 26px;box-shadow:var(--pop);overflow:hidden}
.lcard .swatches{margin:0 -28px 24px;border-radius:0;height:8px}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--pri);color:#fff;font-size:1.15rem}
.lcard h1{font-size:1.45rem;font-weight:800;margin:12px 0 2px;letter-spacing:-.02em}
.lcard p{color:var(--muted);font-size:.86rem;margin-bottom:18px}
/* ---- Navegação ---- */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:248px;background:var(--side);border-right:1px solid var(--border);padding:18px 12px;overflow-y:auto;z-index:2000;transition:transform .25s}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand .mark{width:38px;height:38px;font-size:1rem;border-radius:10px}
.brand b{display:block;font-size:1rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}.brand small{font-size:.72rem;color:var(--dim)}
.nav a{position:relative;display:flex;align-items:center;gap:11px;padding:9px 12px;margin-bottom:2px;border-radius:9px;color:var(--muted);font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none}
.nav a i{width:18px;text-align:center;font-size:.95rem;color:var(--dim)}
.nav a:hover{background:var(--hover);color:var(--text)}
.nav a.on{background:var(--soft);color:var(--pri)}.nav a.on i{color:var(--pri)}
.nav a.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--pri)}
.nav .sep{font-size:.74rem;font-weight:700;color:var(--dim);padding:16px 12px 5px}
/* ---- Estrutura ---- */
.main{margin-left:248px;padding:22px 30px 56px;min-height:100vh;max-width:1500px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}.top h2 i{color:var(--pri);font-size:1.15rem}
.top .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.chip{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);white-space:nowrap;font-weight:600}
.btn.ham{width:38px;height:38px;padding:0;justify-content:center;flex:0 0 auto}
.ham svg{width:18px;height:18px}
@media(min-width:993px){.sidebar,.main{transition:transform .25s,margin-left .25s}body.nav-off .sidebar{transform:translateX(-100%)}body.nav-off .main{margin-left:0}}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow)}
.card>h3{font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;letter-spacing:-.01em}.card>h3 i{color:var(--pri);font-size:.9rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}.kpi .v{font-size:1.55rem;font-weight:800;margin-top:6px;letter-spacing:-.02em;word-break:break-word}.kpi .s{font-size:.78rem;color:var(--dim);margin-top:4px}
.kpi.gold{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}.kpi.gold .v{color:var(--pri)}
.kpi.ok .v{color:var(--green)}.kpi.bad .v{color:var(--red)}
.v.gold{color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-bottom:18px}
.chart{position:relative;height:270px}
/* ---- Formulários ---- */
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:14px}
.fg{display:flex;flex-direction:column;min-width:0}
.fg label{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:6px}
input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border2);border-radius:9px;background:var(--input);color:var(--text);width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--dim)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--soft)}
input[type=checkbox]{width:19px;height:19px;padding:0;accent-color:var(--pri)}
input[type=color]{height:42px;padding:3px}
input[readonly]{opacity:.65}
select option{background:var(--card);color:var(--text)}
.chk{display:flex;align-items:center;gap:9px;font-size:.9rem;font-weight:600;color:var(--text);padding-top:4px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:1px solid transparent;border-radius:9px;font-family:inherit;font-weight:700;font-size:.86rem;cursor:pointer;transition:background .15s,transform .1s;white-space:nowrap;color:#fff}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.5;cursor:not-allowed}
.b-p{background:var(--pri)}.b-p:hover{background:var(--pri2);filter:none}
.b-s{background:var(--green)}.b-d{background:var(--red)}.b-i{background:transparent;color:var(--pri);border-color:var(--border2)}.b-i:hover{background:var(--soft)}
.b-o{background:transparent;color:var(--muted);border-color:var(--border2)}.b-o:hover{background:var(--hover);color:var(--text)}
.b-w{background:transparent;color:var(--gold);border-color:var(--border2)}.b-w:hover{background:var(--hover)}
.sm{padding:6px 9px;font-size:.78rem;border-radius:8px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
/* ---- Tabelas ---- */
.tw{overflow-x:auto;width:100%}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:620px}
th{padding:10px 12px;text-align:left;font-size:.78rem;font-weight:700;color:var(--dim);white-space:nowrap;border-bottom:1px solid var(--border2)}
td{padding:11px 12px;border-bottom:1px solid var(--border);color:var(--muted);vertical-align:middle}
tbody tr:hover td{background:var(--hover);color:var(--text)}td strong{color:var(--text);font-weight:700}
td.n,th.n{text-align:right}
.empty{text-align:center;padding:28px;color:var(--dim)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.fbar>*{flex:1 1 180px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:.74rem;font-weight:700;border:1px solid;white-space:nowrap}
/* ---- Totais do pedido ---- */
.tot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);font-weight:600;font-size:.9rem;color:var(--muted)}
.tot .v{color:var(--text);font-size:1rem;font-weight:700}
.tot.big{margin-top:8px;padding:14px 16px;border:1px solid var(--pri);border-radius:12px;background:var(--soft);color:var(--text)}.tot.big .v{color:var(--pri);font-size:1.3rem;font-weight:800}
.tot.sal{margin-top:8px;padding:14px 16px;border:1px solid var(--green);border-radius:12px;color:var(--text)}.tot.sal .v{color:var(--green);font-size:1.4rem;font-weight:800}
.tot.neg .v{color:var(--red)}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:14px;margin-bottom:16px;border:1px solid var(--pri);background:var(--soft)}
.banner .num{font-size:1.7rem;font-weight:800;color:var(--pri);line-height:1;letter-spacing:-.02em}
.banner small{font-size:.78rem;font-weight:600;color:var(--muted);display:block;margin-bottom:2px}
.alert{padding:10px 14px;border-radius:10px;margin-bottom:8px;font-size:.88rem;border:1px solid var(--border);border-left:4px solid;background:var(--card);color:var(--text)}
.alert.w{border-left-color:var(--gold)}.alert.r{border-left-color:var(--red)}.alert.g{border-left-color:var(--green)}
.cor-dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.45)}
.pager{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:.84rem;color:var(--muted)}
.pager button{padding:6px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--card);color:var(--text);cursor:pointer;font-weight:700;font-family:inherit}.pager button.on{background:var(--pri);color:#fff;border-color:var(--pri)}.pager button:disabled{opacity:.35}
.modal{position:fixed;inset:0;background:rgba(8,12,22,.6);backdrop-filter:blur(4px);z-index:5000;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.mbox{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px 24px;width:100%;max-width:560px;max-height:92vh;overflow:auto;margin:auto;box-shadow:var(--pop)}
.mbox h3{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:1.1rem;font-weight:800}
.x{background:none;border:none;color:var(--dim);font-size:1.5rem;cursor:pointer}.x:hover{color:var(--red)}
.toast{position:fixed;top:18px;left:50%;transform:translate(-50%,-140px);padding:12px 22px;border-radius:12px;font-weight:700;font-size:.9rem;z-index:9999;transition:transform .3s ease;box-shadow:var(--pop);max-width:92vw}
.toast.on{transform:translate(-50%,0)}.toast.err{background:var(--red);color:#fff}
.note{font-size:.8rem;color:var(--dim);margin-top:8px}
.over{display:none;position:fixed;inset:0;background:rgba(8,12,22,.55);z-index:1500}
@media(max-width:992px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:none}.over.open{display:block}.main{margin-left:0;padding:14px 14px 44px}.top h2{font-size:1.25rem}}
@media(max-width:540px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:1.2rem}.row{grid-template-columns:1fr}.btn{padding:10px 14px}.grid2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login"></div>
<div class="over" id="over"></div>
<nav class="sidebar hidden" id="sidebar"></nav>
<div class="main hidden" id="app">
  <div class="swatches" id="swatches"></div>
  <div class="top">
    <h2><button class="btn b-o ham" id="ham" type="button" aria-label="Abrir ou fechar o menu" aria-expanded="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span id="title"></span></h2>
    <div class="r"><span class="chip"><i class="fas fa-user"></i> <span id="uname"></span></span>
      <button class="btn b-o sm" id="themeBtn" title="Tema"><i class="fas fa-circle-half-stroke"></i></button>
      <button class="btn b-d sm" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button></div>
  </div>
  <div id="view"></div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
'use strict';
/* ================= Utilitários ================= */
const KEY='imperio_sistema_v3', SESS='imperio_sessao_v3';
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=v=>v==null?'':String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
const clamp=(v,a=0,b=100)=>Math.min(b,Math.max(a,num(v)));
const fmt=v=>'R$ '+num(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=v=>num(v).toFixed(2).replace('.',',')+'%';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const isoLocal=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoje=()=>isoLocal();
const br=iso=>iso?iso.split('-').reverse().join('/'):'—';
const addDias=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return isoLocal(d)};
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STATUS=['Em andamento','Finalizado','Pendente','Aguardando Pagamento','Entregue','Cancelado'];
const STC={'Em andamento':'#3b82f6','Finalizado':'#10b981','Pendente':'#F3B63B','Aguardando Pagamento':'#f97316','Entregue':'#06b6d4','Cancelado':'#ef4444'};
const PARC={'À vista':{n:1,off:0},'PIX':{n:1,off:0},'Cartão de Crédito':{n:1,off:0},'Cheque Pré-datado':{n:1,off:30},'Boleto 30 dias':{n:1,off:30},'Boleto 30/60':{n:2,off:30},'Boleto 30/60/90':{n:3,off:30},'Parcelado 2x':{n:2,off:30},'Parcelado 3x':{n:3,off:30},'Parcelado 4x':{n:4,off:30},'Parcelado 5x':{n:5,off:30},'Parcelado 6x':{n:6,off:30},'Parcelado 10x':{n:10,off:30},'Parcelado 12x':{n:12,off:30}};
const badge=(t,c)=>`<span class="badge" style="color:${c};border-color:${c}55;background:${c}1f">${esc(t)}</span>`;
const stBadge=s=>badge(s,STC[s]||'#3b82f6');
let toastT;
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className='toast on '+(err?'err':'grad');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200)}
function libOk(nome,ok){if(!ok)toast(`A biblioteca de ${nome} não carregou. Conecte-se à internet e recarregue a página.`,true);return !!ok}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const stamp=()=>{const d=new Date();return `${isoLocal(d)}_${pad(d.getHours())}h${pad(d.getMinutes())}`};

/* ================= Banco de dados (localStorage) ================= */
const SEED_PROD=[['1','CRISTAL BRILHO NATURAL','Cristal Brilho',244.15],['16','CRISTAL BRILHO DUBAI','Cristal Brilho',255.6],['53','DIAMANTE NOBRE NATURAL','Diamante Nobre',313.05],['59','DIAMANTE NOBRE PRETO','Diamante Nobre',353.95],['27','DIAMANTE NOBRE PLUS ARENITO','Diamante Nobre Plus',376.25],['102','GRAFFINO ROYAL NATURAL','Graffino Royal',154.8],['47','GRAFFINO ROYAL MARFIM','Graffino Royal',154.8],['69','TEXTURA RUSTICA NATURAL','Textura Rústica',101.35],['308','EFEITO FULGET LAGO ROSA','Efeito Fulget',297.5],['241','FUNDO PREPARADOR CONCENTRADO 900ML','Fundo Preparador',28.2],['1504','ADITIVOS BRILHO GRANDE PRATA','Aditivos',500.45],['1860','MANTA LIQUIDA GRANDE','Manta Líquida',439.95],['17','CRISTAL BRILHO BRILHANTE RED','Cristal Brilho',255.6],['18','CRISTAL BRILHO POMERIGGIO','Cristal Brilho',255.6],['395','CRISTAL BRILHO ONIX','Cristal Brilho',255.6],['139','EFEITO FULGET AÇO CORTEN','Efeito Fulget',341.8],['625','BROCAL IMPORTADO PRATA','Brocal',20.6]];
const SEED_COR=[['C01','Branco','#ffffff'],['C02','Preto','#000000'],['C03','Azul Royal','#1e40af'],['C04','Verde Musgo','#4d7c0f'],['C05','Vermelho Fogo','#dc2626'],['C06','Amarelo Ouro','#facc15'],['C07','Cinza Chumbo','#4b5563'],['C08','Bege Areia','#d6c7a1'],['C09','Terracota','#c2410c'],['C10','Marfim','#fef3c7']];
const defaultDB=()=>({versao:3,users:[],produtos:[],cores:[],clientes:[],fornecedores:[],fretes:[],representantes:[],movs:[],pedidos:[],draft:null,
  config:{empresa:'IMPÉRIO TINTAS E REVESTIMENTOS',icmsAtivo:true,icmsAliq:7,comPerc:5,lucroPerc:21,mcPerc:21,orient:'portrait',lastBackup:null}});
let db=defaultDB();
function loadDB(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);db=Object.assign(defaultDB(),d);db.config=Object.assign(defaultDB().config,d.config||{});migrarDB(db);return true}}catch(e){console.warn(e)}return false}
let saveT;
function saveNow(){if(window.__zerando)return;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Falha ao salvar (armazenamento cheio?). Faça um backup agora!',true)}}
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
window.addEventListener('beforeunload',saveNow);

/* ================= Autenticação ================= */
async function sha(s){if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}
const hashPw=(pw,salt)=>sha(salt+':'+pw);
let user=null, fails=0, lockUntil=0;
const isAdmin=()=>user&&user.role==='admin';
function renderLogin(){
  const setup=db.users.length===0;
  $('#login').classList.remove('hidden');
  $('#login').innerHTML=`<div class="lcard"><div class="swatches" id="loginSw"></div><div class="mark"><i class="fas fa-fill-drip"></i></div><h1>Império</h1><p>${setup?'Primeiro acesso: crie o administrador do sistema':'Sistema de Gestão Integrada'}</p>
  <form id="lf" style="text-align:left">
   ${setup?`<div class="fg" style="margin-bottom:10px"><label>Seu nome</label><input id="ln" required placeholder="Ex: Diego Timóteo"></div>`:''}
   <div class="fg" style="margin-bottom:10px"><label>Usuário</label><input id="lu" required autocomplete="username" ${setup?'placeholder="Ex: diego"':''}></div>
   <div class="fg" style="margin-bottom:10px"><label>Senha ${setup?'(mín. 6 caracteres)':''}</label><input id="lp" type="password" required autocomplete="${setup?'new-password':'current-password'}"></div>
   ${setup?`<div class="fg" style="margin-bottom:10px"><label>Repetir senha</label><input id="lp2" type="password" required autocomplete="new-password"></div>

  {const sw=$('#loginSw');if(sw)sw.innerHTML=swatchHTML()}

    const login=$('#lu').value.trim().toLowerCase(), pw=$('#lp').value;

      const nome=$('#ln').value.trim(), salt=uid()+uid();
      const rep={id:uid(),nome};db.representantes.push(rep);
      db.users.push({id:uid(),nome,login,salt,hash:await hashPw(pw,salt),role:'admin',repNome:nome});

      saveNow();
    }
    if(Date.now()<lockUntil){err.textContent=`Muitas tentativas. Aguarde ${Math.ceil((lockUntil-Date.now())/1000)}s.`;return}
    const u=db.users.find(x=>x.login===login);
    if(u&&u.hash===await hashPw(pw,u.salt)){fails=0;localStorage.setItem(SESS,u.id);entrar(u)}

  };
}

function calc(d){
  const sub=r2(d.itens.reduce((s,i)=>s+i.total,0)), descP=clamp(d.desc);
  const descV=r2(sub*descP/100), base=r2(Math.max(sub-descV,0));
  const aliq=d.icmsAtivo?clamp(d.icmsAliq):0, imposto=r2(base*aliq/100), total=r2(base+imposto);
  const entrada=r2(Math.min(Math.max(num(d.entrada),0),total));
  return {sub,descP,descV,base,aliq,imposto,total,entrada,saldo:r2(total-entrada)};
}
const taxaGeral=()=>clamp(db.config.comPerc);
function taxaProduto(pr){const m=pr.comModo||'geral';return m==='nenhuma'?0:m==='propria'?clamp(pr.comPerc):taxaGeral()}
function taxaItem(i){const pr=db.produtos.find(x=>x.id===i.produtoId);return pr?taxaProduto(pr):taxaGeral()}
function comissaoPedido(p){const f=p.subtotal>0?p.base/p.subtotal:1;return r2(p.itens.reduce((s,i)=>s+i.total*f*(taxaItem(i)/100),0))}
function migrarDB(d){(d.produtos||[]).forEach(p=>{if(!p.comModo){p.comModo=p.comAtiva===false?'nenhuma':(num(p.comPerc)!==num((d.config||{}).comPerc==null?5:d.config.comPerc)?'propria':'geral')}delete p.comAtiva});
  (d.pedidos||[]).forEach(p=>{delete p.comissao;(p.itens||[]).forEach(i=>{delete i.comPerc})});return d}
const lucroPedido=p=>r2(p.base*num(db.config.lucroPerc)/100);
function saldoEstoque(prod){let s=num(prod.estoqueInicial);db.movs.forEach(m=>{if(m.produtoId===prod.id)s+=m.tipo==='entrada'?m.qtd:-m.qtd});db.pedidos.forEach(p=>{if(p.status==='Cancelado')return;p.itens.forEach(i=>{if(i.produtoId===prod.id)s-=i.qtd})});return s}
const qtdNoPedido=(p,pid)=>!p||p.status==='Cancelado'?0:p.itens.filter(i=>i.produtoId===pid).reduce((s,i)=>s+i.qtd,0);
function gerarParcelas(p,old){
  const cfg=PARC[p.parcelamento]||{n:1,off:0}, arr=[];
  if(p.entrada>0)arr.push({n:0,tipo:'Entrada',valor:p.entrada,venc:p.data,pago:true,dataPgto:p.data});
  if(p.saldo>0.004){
    const n=cfg.n, first=p.venc||addDias(p.data,cfg.off), v=Math.floor(p.saldo/n*100)/100;
    for(let i=0;i<n;i++)arr.push({n:i+1,tipo:n>1?`Parcela ${i+1}/${n}`:'Saldo',valor:i===n-1?r2(p.saldo-v*(n-1)):v,venc:addDias(first,30*i),pago:false,dataPgto:null});
  }
  if(old&&old.length===arr.length)arr.forEach((a,i)=>{if(!a.pago&&old[i].pago){a.pago=true;a.dataPgto=old[i].dataPgto}});

}

  <div class="tot neg"><span>Desconto (${pct(t.descP)})</span><span class="v">- ${fmt(t.descV)}</span></div>
  <div class="tot"><span>Base de cálculo ICMS</span><span class="v">${fmt(t.base)}</span></div>
  <div class="tot"><span>${draft.icmsAtivo?`ICMS (${pct(t.aliq)})`:'ICMS (não aplicado)'}</span><span class="v">${fmt(t.imposto)}</span></div>
  <div class="tot big"><span>TOTAL GERAL</span><span class="v">${fmt(t.total)}</span></div>
  <div class="tot"><span>Entrada / sinal</span><span class="v">- ${fmt(t.entrada)}</span></div>
  <div class="tot sal"><span>SALDO A PAGAR</span><span class="v">${fmt(t.saldo)}</span></div>
  ${num(draft.entrada)>t.total+.004?'<div class="alert r" style="margin-top:8px">A entrada é maior que o total — será limitada ao total.</div>':''}`}
function addItem(){
  const p=db.produtos.find(x=>x.id===$('#iProd').value);if(!p)return toast('Selecione um produto.',true);
  const qtd=Math.max(1,parseInt($('#iQtd').value,10)||1), unit=r2(num($('#iUnit').value)||p.preco);
  if(draft.itens.length>=30)return toast('Limite de 30 itens por pedido.',true);
  const ed=draft.editId?db.pedidos.find(x=>x.id===draft.editId):null;
  if(p.controlaEstoque){const disp=saldoEstoque(p)+qtdNoPedido(ed,p.id)-draft.itens.filter(i=>i.produtoId===p.id).reduce((s,i)=>s+i.qtd,0);if(qtd>disp&&!confirm(`Estoque disponível de "${p.nome}": ${disp}. Adicionar ${qtd} mesmo assim?`))return}
  draft.itens.push({produtoId:p.id,codigo:p.codigo,nome:p.nome,categoria:p.categoria,corCod:$('#iCor').value||'',qtd,unit,total:r2(qtd*unit)});
  persistDraft();renderItens();$('#iProd').value='';$('#iCor').value='';$('#iQtd').value=1;$('#iUnit').value='';
}
function editItem(i){const it=draft.itens[i];if(!it)return;
  openModal(`Editar item`,`<div class="fg" style="margin-bottom:10px"><label>Produto</label><input readonly value="${esc(it.codigo)} - ${esc(it.nome)}"></div>
  <div class="fg" style="margin-bottom:10px"><label>Cor</label><select id="eCor"><option value="">Sem cor específica</option>${opts(db.cores,it.corCod,c=>c.codigo,c=>`${c.codigo} - ${c.nome}`)}</select></div>
  <div class="row"><div class="fg"><label>Quantidade</label><input type="number" id="eQtd" min="1" value="${it.qtd}"></div><div class="fg"><label>Valor unitário</label><input type="number" id="eUnit" step="0.01" min="0" value="${it.unit}"></div></div>
  <div class="acts"><button class="btn b-p" id="eOk"><i class="fas fa-save"></i> Atualizar</button></div>`);
  $('#eOk').onclick=()=>{it.qtd=Math.max(1,parseInt($('#eQtd').value,10)||1);it.unit=r2(num($('#eUnit').value));it.total=r2(it.qtd*it.unit);it.corCod=$('#eCor').value;persistDraft();closeModal();renderItens()}}
function finalizar(){
  const d=draft;if(!d.itens.length)return toast('Adicione ao menos um item.',true);
  const ed0=d.editId?db.pedidos.find(p=>p.id===d.editId):null;
  const cli=d.clienteId==='__snap__'&&ed0?Object.assign({id:ed0.clienteId||''},ed0.clienteSnap):db.clientes.find(c=>c.id===d.clienteId);if(!cli)return toast('Selecione o cliente.',true);
  if(!d.repNome)return toast('Selecione o representante.',true);
  const t=calc(d), ed=d.editId?db.pedidos.find(p=>p.id===d.editId):null;
  if(d.editId&&!ed){toast('O pedido em edição não existe mais.',true);draft=newDraft();persistDraft();return go('pedido')}
  if(d.status!=='Cancelado'){const neg=[];db.produtos.filter(p=>p.controlaEstoque).forEach(p=>{const q=d.itens.filter(i=>i.produtoId===p.id).reduce((s,i)=>s+i.qtd,0);if(q&&saldoEstoque(p)+qtdNoPedido(ed,p.id)-q<0)neg.push(p.nome)});
    if(neg.length&&!confirm('O estoque ficará negativo para:\n• '+neg.join('\n• ')+'\n\nContinuar mesmo assim?'))return}
  const resumo=`${ed?'SALVAR ALTERAÇÕES NO':'FINALIZAR'} PEDIDO #${ed?ed.numero:nextNum()}\n\nCliente: ${cli.nome}\nRepresentante: ${d.repNome}\nStatus: ${d.status}\nPagamento: ${d.parc}\nItens: ${d.itens.length}\n\nTotal: ${fmt(t.total)}\nEntrada: ${fmt(t.entrada)}\nSaldo: ${fmt(t.saldo)}\n\nConfirmar?`;
  if(!confirm(resumo))return;
  const now=new Date();
  const p={id:ed?ed.id:uid(),numero:ed?ed.numero:nextNum(),data:ed?ed.data:hoje(),hora:ed?ed.hora:now.toLocaleTimeString('pt-BR'),criadoPor:ed?ed.criadoPor:user.id,
   clienteId:cli.id,clienteSnap:{nome:cli.nome,cnpj:cli.cnpj||'',inscricao:cli.inscricao||'',telefone:cli.telefone||'',cidade:cli.cidade||''},repNome:d.repNome,status:d.status,parcelamento:d.parc,venc:d.venc||'',obsPag:d.obsPag.trim(),obs:d.obs.trim(),
   itens:JSON.parse(JSON.stringify(d.itens)),desc:t.descP,entrada:t.entrada,icmsAtivo:d.icmsAtivo,icmsAliq:t.aliq,subtotal:t.sub,descValor:t.descV,base:t.base,imposto:t.imposto,total:t.total,saldo:t.saldo};
  p.parcelas=gerarParcelas(p,ed&&ed.parcelas);
  if(ed)db.pedidos[db.pedidos.indexOf(ed)]=p;else db.pedidos.push(p);
  draft=newDraft();db.draft=null;saveNow();toast(ed?`Pedido #${p.numero} atualizado!`:`Pedido #${p.numero} finalizado!`);go('historico');
}
function carregarEdicao(id){const p=db.pedidos.find(x=>x.id===id);if(!p)return;
  if(draft.itens.length&&!draft.editId&&!confirm('Há um pedido em andamento no formulário. Descartá-lo para editar este?'))return;
  draft={itens:JSON.parse(JSON.stringify(p.itens)),clienteId:db.clientes.some(c=>c.id===p.clienteId)?p.clienteId:'__snap__',repNome:p.repNome,status:p.status,parc:p.parcelamento,venc:p.venc||'',obsPag:p.obsPag||'',obs:p.obs||'',desc:p.desc,entrada:p.entrada,icmsAtivo:p.icmsAtivo,icmsAliq:p.icmsAliq||db.config.icmsAliq,editId:p.id};
  persistDraft();go('pedido')}
function duplicar(id){const p=db.pedidos.find(x=>x.id===id);if(!p)return;
  if(draft.itens.length&&!confirm('Descartar o pedido em andamento no formulário?'))return;
  draft=Object.assign(newDraft(),{itens:JSON.parse(JSON.stringify(p.itens)),clienteId:p.clienteId,parc:p.parcelamento,desc:p.desc,icmsAtivo:p.icmsAtivo,icmsAliq:p.icmsAliq||db.config.icmsAliq,obs:p.obs||''});

function formEntidade(e,id){

function excluirEntidade(e,id){const st=db[storeOf(e)],rec=st.find(r=>r.id===id);if(!rec)return;

  <div class="fg"><label>Nome da empresa</label><input id="cfEmp" value="${esc(c.empresa)}"></div>
  <div class="fg"><label>ICMS padrão em novos pedidos (%)</label><input type="number" step="0.01" id="cfIcms" value="${c.icmsAliq}"></div>
  <div class="fg"><label>Margem de contribuição (%)</label><input type="number" step="0.01" id="cfMc" value="${c.mcPerc}"></div>
  <div class="fg"><label>Orientação do PDF</label><select id="cfOr"><option value="portrait" ${c.orient==='portrait'?'selected':''}>Retrato</option><option value="landscape" ${c.orient==='landscape'?'selected':''}>Paisagem</option></select></div></div>
  <div class="note" style="margin:0 0 10px">As taxas de comissão e de lucro ficam na tela Comissões & Vendas.</div><label class="chk"><input type="checkbox" id="cfIcmsOn" ${c.icmsAtivo?'checked':''}> Aplicar ICMS por padrão em novos pedidos</label>
  <div class="acts"><button class="btn b-p" data-act="saveCfg"><i class="fas fa-save"></i> Salvar parâmetros</button></div></div>
  <div class="card"><h3><i class="fas fa-users-gear"></i> Usuários do sistema</h3><div class="fbar"><button class="btn b-p" style="flex:0 0 auto" data-act="novo" data-e="usuarios"><i class="fas fa-user-plus"></i> Novo usuário</button></div><div class="tw" id="tb_usuarios"></div>
  <div class="note">Vendedores só enxergam os pedidos que criaram ou que pertencem ao representante vinculado, e não acessam Configurações nem Backup.</div></div>`},
 after(){cadTable('usuarios',$('#tb_usuarios'))}};
function saveCfg(){const c=db.config;c.empresa=$('#cfEmp').value.trim()||c.empresa;c.icmsAliq=clamp($('#cfIcms').value);c.mcPerc=clamp($('#cfMc').value);c.orient=$('#cfOr').value;c.icmsAtivo=$('#cfIcmsOn').checked;if(!draft.itens.length&&!draft.editId&&!draft.clienteId&&!draft.obs&&!num(draft.entrada)&&!num(draft.desc)){draft=newDraft();db.draft=null}saveNow();toast('Parâmetros salvos!')}

/* ---------- Backup ---------- */
VIEWS.backup={html(){const c=db.config.lastBackup;return `<div class="card"><h3><i class="fas fa-database"></i> Backup e restauração</h3>
  <div class="alert ${c?'g':'w'}">Último backup: <b>${c?new Date(c).toLocaleString('pt-BR'):'nunca realizado'}</b></div>
  <div class="kpis" style="margin-top:12px">${[['Produtos',db.produtos.length],['Cores',db.cores.length],['Clientes',db.clientes.length],['Fornecedores',db.fornecedores.length],['Fretes',db.fretes.length],['Representantes',db.representantes.length],['Usuários',db.users.length],['Pedidos',db.pedidos.length],['Movim. estoque',db.movs.length]].map(x=>`<div class="kpi"><div class="l">${x[0]}</div><div class="v gold">${x[1]}</div></div>`).join('')}</div>
  <p class="note">Os dados ficam apenas neste navegador. Baixe um backup com frequência e guarde fora do computador (nuvem, pendrive). O arquivo inclui os usuários (com senhas protegidas por hash).</p>
  <div class="acts"><button class="btn b-p" data-act="bkDown"><i class="fas fa-download"></i> Baixar backup (JSON)</button><button class="btn b-s" data-act="bkUp"><i class="fas fa-upload"></i> Restaurar backup</button><input type="file" id="bkFile" accept=".json" class="hidden"><button class="btn b-d" data-act="bkZero"><i class="fas fa-broom"></i> Zerar sistema</button></div>
  <p class="note">A restauração aceita backups deste sistema <b>e também os do sistema antigo</b> (pedidos, clientes, produtos e cores são convertidos).</p></div>`},
 after(){$('#bkFile').onchange=restaurar}};
function bkDown(deSaida){db.config.lastBackup=new Date().toISOString();saveNow();download(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),`backup_imperio_${stamp()}.json`);if(!deSaida){toast('Backup baixado!');go('backup')}}
function dmy(s){const m=String(s||'').split('/');return m.length===3?`${m[2]}-${pad(m[1])}-${pad(m[0])}`:hoje()}
function converterLegado(d){
  const n=defaultDB(),cMap={},pMap={};
  (d.catalogo||d.produtos||[]).forEach(p=>{const id=uid();pMap[p.codigo]=id;n.produtos.push({id,codigo:String(p.codigo),nome:p.nome,categoria:p.categoria||'',preco:num(p.preco),comModo:p.comissaoAtiva===false?'nenhuma':(p.comissaoPercent!=null&&num(p.comissaoPercent)!==(d.comissaoPercent!=null?num(d.comissaoPercent):5)?'propria':'geral'),comPerc:p.comissaoPercent!=null?num(p.comissaoPercent):5,controlaEstoque:false,estoqueInicial:0,estoqueMin:0})});
  (d.cores||[]).forEach(c=>n.cores.push({id:uid(),codigo:c.codigo,nome:c.nome,hex:c.hex||'#888888',ref:c.referencia||''}));
  (d.clientes||[]).forEach(c=>{const id=uid();cMap[c.id]=id;n.clientes.push({id,nome:c.nome,cnpj:c.cnpj||'',inscricao:c.inscricao||'',telefone:c.telefone||'',cidade:c.cidade||''})});
  (d.fornecedores||[]).forEach(f=>n.fornecedores.push({id:uid(),nome:f.nome,cnpj:f.cnpj||'',inscricao:f.inscricao||'',telefone:f.telefone||''}));
  (d.fretes||[]).forEach(f=>n.fretes.push({id:uid(),transportadora:f.transportadora,prazo:num(f.prazo),valor:num(f.valor)}));
  const reps=new Set(d.representantes||[]);(d.historico||[]).forEach(h=>h.representante&&reps.add(h.representante));reps.forEach(r=>n.representantes.push({id:uid(),nome:r}));
  const g=d.comissaoPercent!=null?num(d.comissaoPercent):5;
  (d.historico||[]).forEach(h=>{
    const itens=(h.itens||[]).map(i=>{const prod=n.produtos.find(x=>x.codigo===String(i.codigo));return {produtoId:prod?prod.id:'',codigo:String(i.codigo),nome:i.nome,categoria:i.categoria||'',corCod:i.cor||'',qtd:num(i.quantidade),unit:num(i.unitario),total:num(i.total)}});
    const aliq=h.aliquotaICMS!=null?num(h.aliquotaICMS):0,ativo=h.icmsAtivo!==false&&aliq>0;
    const t=calc({itens,desc:h.descontoPercent||0,entrada:h.entrada||0,icmsAtivo:ativo,icmsAliq:aliq});
    const cl=h.cliente||{};
    const p={id:uid(),numero:h.numero,data:dmy(h.data),hora:h.hora||'',criadoPor:'',clienteId:cMap[cl.id]||'',clienteSnap:{nome:cl.nome||'—',cnpj:cl.cnpj||'',inscricao:cl.inscricao||'',telefone:cl.telefone||'',cidade:cl.cidade||''},repNome:h.representante||'',status:STATUS.includes(h.status)?h.status:'Em andamento',parcelamento:PARC[h.parcelamento]?h.parcelamento:'À vista',venc:h.vencimento||'',obsPag:h.formaPagamentoObs||'',obs:h.observacao||'',itens,desc:t.descP,entrada:t.entrada,icmsAtivo:ativo,icmsAliq:t.aliq,subtotal:t.sub,descValor:t.descV,base:t.base,imposto:t.imposto,total:t.total,saldo:t.saldo};
    p.parcelas=gerarParcelas(p);n.pedidos.push(p)});
  Object.assign(n.config,{comPerc:g,lucroPerc:d.lucroPercent!=null?num(d.lucroPercent):21,icmsAliq:d.aliquotaICMSAtual!=null?num(d.aliquotaICMSAtual):7,icmsAtivo:d.icmsAtivo!==false,orient:d.orientacaoPDF||'portrait',empresa:(d._meta&&d._meta.sistema)||n.config.empresa});
  return n}
function restaurar(ev){const f=ev.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{
  const d=JSON.parse(rd.result);let n,tipo;
  if(d.versao===3&&Array.isArray(d.produtos)&&Array.isArray(d.pedidos)){n=Object.assign(defaultDB(),d);n.config=Object.assign(defaultDB().config,d.config||{});migrarDB(n);tipo='deste sistema (v3)'}
  else if(d.catalogo||d.produtos||d.historico){n=converterLegado(d);tipo='do sistema antigo (será convertido)'}
  else throw new Error('Arquivo não reconhecido.');
  if(!confirm(`Backup ${tipo}\n\n• ${n.produtos.length} produtos\n• ${n.cores.length} cores\n• ${n.clientes.length} clientes\n• ${n.pedidos.length} pedidos\n\nIsso SUBSTITUI os dados atuais (usuários ${tipo.startsWith('deste')?'incluídos':'atuais são mantidos'}). Continuar?`))return;
  if(!tipo.startsWith('deste'))n.users=db.users;
  const meu=user.id;db=n;if(!db.users.some(u=>u.id===meu)){saveNow();toast('Backup restaurado. Faça login novamente.');return setTimeout(sair,1200)}
  user=db.users.find(u=>u.id===meu);draft=newDraft();db.draft=null;saveNow();toast('Backup restaurado!');go('backup')}catch(e){toast('Erro ao restaurar: '+e.message,true)}};rd.readAsText(f);ev.target.value=''}
function bkZero(){if(!confirm('Apagar TODOS os dados do sistema (inclusive usuários)?'))return;if(!confirm('Tem certeza? Baixe um backup antes. Esta ação não pode ser desfeita.'))return;window.__zerando=true;clearTimeout(saveT);localStorage.removeItem(KEY);localStorage.removeItem(SESS);location.reload()}

/* ================= Modal ================= */
function openModal(title,body){$('#modalRoot').innerHTML=`<div class="modal" id="mdl"><div class="mbox"><h3>${esc(title)} <button class="x" data-act="closeModal">&times;</button></h3>${body}</div></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}

/* ================= Eventos globais ================= */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}
  const pg=e.target.closest('[data-pg]');if(pg&&!pg.disabled){ui.pg=parseInt(pg.dataset.pg,10);return histTable()}
  if(e.target.id==='mdl')return closeModal();
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id,i=parseInt(b.dataset.i,10);
  const A={
   closeModal,addItem,editItem:()=>editItem(i),delItem:()=>{draft.itens.splice(i,1);persistDraft();renderItens()},finalizar,
   cancelEdit:()=>{if(!confirm('Cancelar a edição e descartar as alterações?'))return;draft=newDraft();db.draft=null;saveNow();go('pedido')},
   limpar:()=>{if(draft.editId)return A.cancelEdit();if(!draft.itens.length&&!draft.obs&&!draft.entrada&&!draft.desc)return;if(!confirm('Limpar o pedido atual?'))return;draft=newDraft();db.draft=null;saveNow();go('pedido')},
   pdf:()=>pdfPedido(id),editPed:()=>carregarEdicao(id),dupPed:()=>duplicar(id),
   delPed:()=>{const p=db.pedidos.find(x=>x.id===id);if(!p||!confirm(`Excluir o pedido #${p.numero} (${fmt(p.total)})? Não pode ser desfeito.`))return;if(draft.editId===id){draft=newDraft();db.draft=null}db.pedidos=db.pedidos.filter(x=>x.id!==id);saveNow();histTable();toast('Pedido excluído.')},
   baixa:()=>{const p=db.pedidos.find(x=>x.id===id);if(!p)return;const d=prompt('Data do pagamento (AAAA-MM-DD):',hoje());if(d===null)return;if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return toast('Data inválida. Use AAAA-MM-DD.',true);p.parcelas[i].pago=true;p.parcelas[i].dataPgto=d;saveNow();recTable();toast('Baixa registrada!')},
   estorna:()=>{const p=db.pedidos.find(x=>x.id===id);if(!p||!confirm('Estornar este pagamento?'))return;p.parcelas[i].pago=false;p.parcelas[i].dataPgto=null;saveNow();recTable()},
   addMov:()=>{const q=Math.floor(num($('#mQ').value));if(q<1)return toast('Quantidade inválida.',true);db.movs.push({id:uid(),produtoId:$('#mP').value,tipo:$('#mT').value,qtd:q,data:hoje(),obs:$('#mO').value.trim()});saveNow();go('estoque');toast('Movimentação registrada!')},
   delMov:()=>{if(!confirm('Excluir esta movimentação?'))return;db.movs=db.movs.filter(m=>m.id!==id);saveNow();go('estoque')},
   expCSV,expXLS,expPDF,novo:()=>formEntidade(b.dataset.e),editar:()=>formEntidade(b.dataset.e,id),excluir:()=>excluirEntidade(b.dataset.e,id),
   saveCfg,aplicarCom:aplicarComissao,sairComBackup:()=>{bkDown(true);toast('Backup baixado. Saindo…');setTimeout(sair,900)},sairAgora:sair,bkDown,bkUp:()=>$('#bkFile').click(),bkZero};
  if(A[a])A[a]()});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.d;if(!k||!draft)return;
  draft[k]=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?0:num(t.value)):t.value;
  persistDraft();if(['desc','entrada','icmsAtivo','icmsAliq'].includes(k))renderTotais()});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.act==='setStatus'){const p=db.pedidos.find(x=>x.id===t.dataset.id);if(!p)return;
    if(t.value!=='Cancelado'&&p.status==='Cancelado'){const neg=db.produtos.filter(pr=>pr.controlaEstoque&&p.itens.some(i=>i.produtoId===pr.id)&&saldoEstoque(pr)-qtdNoPedido({status:'x',itens:p.itens},pr.id)<0);if(neg.length&&!confirm('Reativar este pedido deixará o estoque negativo em: '+neg.map(x=>x.nome).join(', ')+'. Continuar?')){t.value=p.status;return}}
    if(t.value==='Cancelado'&&!confirm(`Cancelar o pedido #${p.numero}? O estoque é devolvido e as parcelas deixam de contar.`)){t.value=p.status;return}
    p.status=t.value;saveNow();histTable();toast('Status atualizado.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
const mobile=()=>window.matchMedia('(max-width:992px)').matches;
function menuAberto(){return mobile()?$('#sidebar').classList.contains('open'):!document.body.classList.contains('nav-off')}
function fecharMenuMobile(){$('#sidebar').classList.remove('open');$('#over').classList.remove('open');$('#ham').setAttribute('aria-expanded',String(menuAberto()))}
function alternarMenu(){
  if(mobile()){const abrir=!$('#sidebar').classList.contains('open');$('#sidebar').classList.toggle('open',abrir);$('#over').classList.toggle('open',abrir)}
  else{const off=document.body.classList.toggle('nav-off');try{localStorage.setItem('imperio_nav_off',off?'1':'0')}catch(e){}}
  $('#ham').setAttribute('aria-expanded',String(menuAberto()))}
$('#ham').addEventListener('click',alternarMenu);
try{if(localStorage.getItem('imperio_nav_off')==='1')document.body.classList.add('nav-off')}catch(e){}
window.addEventListener('resize',()=>{if(!mobile())fecharMenuMobile();else $('#ham').setAttribute('aria-expanded',String(menuAberto()))});
$('#over').onclick=fecharMenuMobile;
$('#logoutBtn').onclick=()=>{
  if(!isAdmin())return sair();
  openModal('Sair do sistema',`<p style="color:var(--muted);margin-bottom:18px">Seus dados ficam salvos só neste navegador. Quer baixar uma cópia de segurança antes de sair?</p>
  <div class="acts" style="flex-direction:column"><button class="btn b-p" style="justify-content:center;padding:12px" data-act="sairComBackup"><i class="fas fa-download"></i> Baixar backup e sair</button>
  <button class="btn b-o" style="justify-content:center;padding:12px" data-act="sairAgora">Sair sem backup</button>
  <button class="btn b-o" style="justify-content:center;padding:12px" data-act="closeModal">Continuar no sistema</button></div>`)};
$('#themeBtn').onclick=()=>{const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('imperio_tema',t)}catch(e){}if(ROUTES[location.hash.slice(1)])go(location.hash.slice(1))};
window.addEventListener('hashchange',()=>{if(user&&ROUTES[location.hash.slice(1)]&&!$('#title').innerHTML.includes(ROUTES[location.hash.slice(1)][0]))go(location.hash.slice(1))});

/* ================= Inicialização ================= */
(function init(){
  let temDados=loadDB();
  if(!temDados){ // migração automática do sistema antigo (mesmo navegador)
    try{const leg={};['catalogo','historico','fornecedores','clientes','fretes','cores','representantes','comissao_percent','lucro_percent','icms_ativo','icms_aliquota'].forEach(k=>{const v=localStorage.getItem('pop_tintas_'+k);if(v)leg[k]=JSON.parse(v)});
      if(leg.catalogo||leg.historico){const n=converterLegado({catalogo:leg.catalogo,historico:leg.historico,fornecedores:leg.fornecedores,clientes:leg.clientes,fretes:leg.fretes,cores:leg.cores,representantes:leg.representantes,comissaoPercent:leg.comissao_percent,lucroPercent:leg.lucro_percent,icmsAtivo:leg.icms_ativo,aliquotaICMSAtual:leg.icms_aliquota});db=n;saveNow();window._migrado=true}}catch(e){console.warn('Migração falhou',e)}}
  const sid=localStorage.getItem(SESS),u=db.users.find(x=>x.id===sid);
  if(u)entrar(u);else{renderLogin();if(window._migrado)setTimeout(()=>toast('Dados do sistema antigo importados! Crie o administrador.'),400)}
})();
</script>
</body>
